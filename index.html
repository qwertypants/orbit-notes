<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#10121c" />
    <meta name="description" content="Explore music theory through a colorful, interactive circle of notes." />
    <meta name="application-name" content="Orbit" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <link rel="icon" href="%BASE_URL%icon.svg" type="image/svg+xml" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>Orbit — Music Theory Explorer</title>
    <script>
      if (!matchMedia('(prefers-reduced-motion: reduce)').matches) {
        const recovery = setTimeout(() => {
          if (document.documentElement.dataset.orbitBoot === 'pending') {
            document.documentElement.dataset.orbitBoot = 'recovered'
          }
        }, 1200)
        addEventListener('orbit:motion-ready', () => clearTimeout(recovery), { once: true })
        document.documentElement.dataset.orbitBoot = 'pending'
      }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <noscript><p>Orbit needs JavaScript to explore and play notes. Enable JavaScript, then reload.</p></noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
